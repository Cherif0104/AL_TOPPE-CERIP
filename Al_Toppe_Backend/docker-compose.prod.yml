
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-altoppe_prod}
      POSTGRES_USER: ${DB_USER:-altoppe_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-altoppe_redis_password}
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: unless-stopped
    # ❌ PAS de ports: - le Redis est interne à Docker

  web:
    build: .
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME:-altoppe_prod}
      - DB_USER=${DB_USER:-altoppe_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-altoppe_redis_password}@redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    volumes:
      - ./staticfiles:/var/www/al-toppe/staticfiles
      - ./media:/var/www/al-toppe/media
    networks:
      - app-network
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 altoppe.wsgi:application"

  celery:
    build: .
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME:-altoppe_prod}
      - DB_USER=${DB_USER:-altoppe_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-altoppe_redis_password}@redis:6379/0
    volumes:
      - ./staticfiles:/var/www/al-toppe/staticfiles
      - ./media:/var/www/al-toppe/media
    networks:
      - app-network
    restart: unless-stopped
    command: >
      sh -c "celery -A altoppe worker --loglevel=info --concurrency=2 & 
             celery -A altoppe beat --loglevel=info"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./staticfiles:/var/www/al-toppe/staticfiles:ro
      - ./media:/var/www/al-toppe/media:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  app-network:
    driver: bridge