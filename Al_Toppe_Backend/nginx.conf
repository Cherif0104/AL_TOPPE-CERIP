events {
    worker_connections 1024;
}

http {
    # Upstream pour al-toppe API
    upstream al_toppe_api {
        server localhost:8001;
    }
    
    # Upstream pour wolof-sign
    upstream al_toppe {
        server localhost:8000;
    }

    # Server block pour sign.altoppe.sn (Wolof-Sign)
    server {
        listen 80;
        server_name api.altoppe.sn;
        
        location / {
            proxy_pass http://al_toppe;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            alias /var/www/al-toppe/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Server block pour api.altoppe.sn (Al-toppe API)
    server {
        listen 80;
        server_name api.altoppe.sn;
        
        location / {
            proxy_pass http://al_toppe_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Server block pour www.altoppe.sn (redirection vers Vercel)
    server {
        listen 80;
        server_name www.altoppe.sn altoppe.sn;
        
        return 301 https://www.altoppe.sn$request_uri;
    }

    # Server block par défaut
    server {
        listen 80 default_server;
        server_name _;
        return 404;
    }
}
