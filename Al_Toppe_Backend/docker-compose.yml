services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: altoppe
      POSTGRES_USER: altoppe_user
      POSTGRES_PASSWORD: Bamsachine97@123
      POSTGRES_HOST_AUTH_METHOD: trust
    command: postgres -c ssl=off
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-altoppe_redis_password}
    volumes:
      - redis_data:/data
    restart: unless-stopped

  web:
    build: .
    environment:
      - DEBUG=False
      - SECRET_KEY=votre-secret-key-tres-longue-ici
      - DB_NAME=altoppe
      - DB_USER=altoppe_user
      - DB_PASSWORD=Bamsachine97@123
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://:altoppe_redis_password@redis:6379/0
      - ALLOWED_HOSTS=api.altoppe.sn,localhost,127.0.0.1
    volumes:
      - ./staticfiles:/var/www/al-toppe/staticfiles
      - ./media:/var/www/al-toppe/media
    depends_on:
      - db
      - redis
    restart: unless-stopped
    command: gunicorn altoppe.wsgi:application --bind 0.0.0.0:8000 --workers 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./staticfiles:/var/www/al-toppe/staticfiles:ro
      - ./media:/var/www/al-toppe/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

